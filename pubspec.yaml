name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.14.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.1.0
  provider: ^6.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.2.0
  image_picker: ^1.1.2
  firebase_storage: ^13.6.0
  onesignal_flutter: ^5.7.0
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  firebase_core_web: 3.10.0

flutter:
  uses-material-design: true
  assets:
    - lib/widgets/imagens/fake-map.jpg
    - assets/

# Gera o ícone real do app (Android/iOS/Web) a partir do logo do GoSchool —
# antes ficava com o ícone padrão do Flutter (o "F" azul) porque nunca
# tinha sido configurado. Rodar com: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.jpg"
    background_color: "#ffffff"
    theme_color: "#1D58E2"